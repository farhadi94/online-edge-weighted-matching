name: Code and Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: make check score PYTHON=python

  tournament:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        m: [500, 1000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Arb certificate
        run: |
          mkdir -p review/numerical
          python paper/verifiers/verify_tournament_two.py --m ${{ matrix.m }} --out review/numerical/tournament${{ matrix.m }}.json
      - name: Independent Decimal certificate
        run: python scripts/verify_tournament_decimal.py --m ${{ matrix.m }} --out review/numerical/tournament${{ matrix.m }}-decimal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tournament-${{ matrix.m }}
          path: review/numerical/*.json

  lean-main:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: WeightedMatchingLean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Verify the 0.556195 main theorem and its axioms
        run: |
          lean_binary=$(cd WeightedMatchingLean && elan which lean)
          python scripts/verify_main_lean.py --lean "$lean_binary" --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-main-audit
          path: |
            research/completion/lean/research-build-result.json
            research/completion/lean/research-main-axioms.log
            research/completion/lean/offline-widget-provenance.json

  lean-original:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: WeightedMatchingLean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - run: python3 verify.py --jobs 2
        working-directory: WeightedMatchingLean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-original-audit
          path: WeightedMatchingLean/verification/current/
